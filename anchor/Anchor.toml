[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

# Run `anchor keys sync` after the first `anchor build` to write the real program ID here
# and into declare_id! in lib.rs. (Solana Playground does this automatically.)
[programs.localnet]
medtrace = "11111111111111111111111111111111"

[programs.devnet]
medtrace = "11111111111111111111111111111111"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
